[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asciicraft"
version = "1.0.0"
description = "ASCII Minecraft for your terminal: a procedural voxel world raycast into colored characters"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Nicholas Lundgren" }]
license = { text = "MIT" }
keywords = ["voxel", "ascii", "raycasting", "terminal", "procedural", "perlin", "minecraft"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lewodro/asciicraft"
Repository = "https://github.com/lewodro/asciicraft"
Live Demo = "https://lewodro.github.io/asciicraft/"
Changelog = "https://github.com/lewodro/asciicraft/commits/main"

[project.scripts]
asciicraft = "voxelterm.app:main"
voxelterm = "voxelterm.app:main"

[tool.setuptools]
packages = ["voxelterm"]
