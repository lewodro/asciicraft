name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Pin the runner: ubuntu-latest moved to 26.04, which has no Python 3.9
    # build, and the project still advertises 3.9 support.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile
        run: python3 -m py_compile main.py voxelterm/*.py tools/*.py

      - name: Check repository files and links
        run: python3 tools/check_repo.py

      - name: Render a snapshot
        run: python3 main.py --small --snapshot frame.ansi --width 80 --height 24

      - name: Benchmark the serial renderer
        run: python3 main.py --small --benchmark 3 --width 80 --height 24 --serial

      - name: Check the packaged entry point
        run: python3 -m voxelterm --help
